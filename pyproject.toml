[project]
name = "my-hermes"
version = "0.1.0"
description = "Hermes — modular agent framework with scheduled tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100",
    "openai>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.20",
    "aiohttp>=3.9",
    "certifi>=2024.0",
    "qrcode>=7.4",
    "httpx>=0.28,<1",
    "tzdata>=2026.3",
    "playwright>=1.61.0",
    "prompt-toolkit>=3.0.52,<4",
    "python-docx>=1.2.0",
    "pywinpty>=3.0,<4 ; sys_platform == 'win32'",
    "ptyprocess>=0.7,<1 ; sys_platform != 'win32'",
]

[tool.setuptools.packages.find]
include = ["hermes", "hermes.*", "browser", "browser.*", "documents", "documents.*"]

[tool.setuptools.package-data]
"hermes.web" = [
    "frontend_dist/index.html",
    "frontend_dist/assets/*",
]
"documents.docx" = [
    "node_runtime/bundle-manifest.json",
    "node_runtime/package.json",
    "node_runtime/package-lock.json",
    "node_runtime/vendor/docx.mjs",
    "node_runtime/vendor/LICENSE.docx.txt",
    "node_runtime/scripts/build-bundle.mjs",
    "node_runtime/scripts/check.mjs",
    "node_runtime/scripts/create.mjs",
]
"hermes.skills.bundled" = [
    "skills/*/SKILL.md",
    "skills/*/.myhermes.json",
    "skills/*/references/*",
    "skills/*/references/**/*",
    "skills/*/templates/*",
    "skills/*/templates/**/*",
    "skills/*/scripts/*",
    "skills/*/scripts/**/*",
    "skills/*/assets/*",
    "skills/*/assets/**/*",
]
