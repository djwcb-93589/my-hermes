[project]
name = "my-hermes"
version = "0.1.0"
description = "Hermes — modular agent framework with scheduled tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100",
    "openai>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.20",
    "aiohttp>=3.9",
    "certifi>=2024.0",
    "qrcode>=7.4",
    "httpx>=0.28,<1",
    "tzdata>=2026.3",
    "playwright>=1.61.0",
]

[project.optional-dependencies]
# 浏览器读取模块(optional)。安装后还需 `playwright install chromium` 下载浏览器。
# 放在 optional 里,不用浏览器的用户不必承担 ~300MB 的下载成本。
browser = ["playwright>=1.40"]

[tool.setuptools.packages.find]
include = ["hermes", "hermes.*", "browser", "browser.*"]
