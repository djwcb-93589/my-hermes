[project]
name = "my-hermes"
version = "0.1.0"
description = "Hermes — modular agent framework with scheduled tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.100",
    "openai>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.20",
    "aiohttp>=3.9",
    "certifi>=2024.0",
    "qrcode>=7.4",
    "httpx>=0.28,<1",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
